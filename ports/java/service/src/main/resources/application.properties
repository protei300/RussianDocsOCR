# Spring's own knobs. Everything the SERVICE is configured by lives in the environment and is read by
# config/Settings.kt — this file only turns off framework behaviour that would compete with it.

# Spring's error page and error controller are OFF: api/ApiErrors.kt owns the error contract, and Spring's
# {"timestamp","status","error","path"} body is a second, competing shape no client of this service parses.
server.error.whitelabel.enabled=false

# Logback carries Spring's own startup lines; the service's log is the JSON stream from logging/LogRing.kt.
# Turned down so the two do not interleave in the operator's terminal.
logging.level.root=WARN
logging.level.org.springframework=WARN

# No static-resource handler and no welcome page: api/ApiMisc.kt::spa serves web/dist, and Spring's default
# handler would shadow the catch-all for exactly the asset paths the SPA needs.
spring.web.resources.add-mappings=false
spring.mvc.static-path-pattern=/__disabled__/**

# The catch-all mapping must see paths that look like files, which means Spring MVC must not try to resolve
# them itself first.
spring.mvc.throw-exception-if-no-handler-found=true
