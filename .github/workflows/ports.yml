# The ports, graded against the reference.
#
# **Separate from `ci.yml`, on a schedule and on demand, and that is a deliberate trade.** Every port
# needs a native toolchain: OpenCV 4.13 built from source for Go and Kotlin (ten to twenty-five
# minutes), a GTK stack for .NET's prebuilt native, and ONNX Runtime for each. Putting that on every
# pull request would make the fast checks slow and the slow checks ignored.
#
# What this loses, stated plainly: **a change to the library can break a port and nobody learns until
# the weekly run.** That is acceptable only because the reference's own conformance run (in `ci.yml`)
# catches the change that matters most — a moved golden — on the pull request itself. If the ports
# start breaking often, promote this to `pull_request` and pay the minutes.
#
# 4.13.0 is not a preference: contour approximation changed in OpenCV 4.8 and the goldens encode 4.13
# behaviour. A port built against 4.9 fails `borders.segments` for a reason nothing in the code
# explains.
#
# PROVENANCE: this ran red twice before it ran at all, and every cause was packaging — the note
# that used to stand here predicted exactly that and was right. What it cost, so that a fourth port
# does not pay it again:
#
#   1. ONNX Runtime 1.21.1 publishes no linux-x64 CPU tarball; the download 404'd. Already recorded
#      in ports/go/build/Dockerfile, which had met it and pinned 1.21.0 — but the workflow had its
#      own copy of the version. Both now read the `env:` block below.
#   2. Every shell script in the repository was mode 100644. `Permission denied`, exit 126.
#   3. `RDOCS_OPENCV_HOME` could not resolve for two independent reasons at once: it named
#      ${{ github.workspace }}/../opencv-build while the script installs into ~/opencv-build, and it
#      was set in a step-level `env:`, where Actions does not expand `$HOME`.
#   4. The Go job installed apt's libopencv-dev under a comment claiming a source build "below"
#      overrode it. There was no such step — it had been carried over from the Kotlin job — and 4.6
#      does not merely differ from 4.13, it fails to COMPILE gocv. See that job for the detail.
#   5. `go build ./...` produced no binary, so Conformance would have failed on a missing
#      ports/go/bin/rdocs-conform even had the compile succeeded.
#
# The pattern in 1, 4 and 5 is the same one: the workflow restated what a port's own build recipe
# already knew, instead of calling it. Prefer `ports/<lang>/…` scripts over inline commands here.
name: ports

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Cheap to move; the point is that it runs without anyone asking.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      port:
        description: Which port to grade
        required: true
        default: all
        type: choice
        options: [all, go, dotnet, java]

env:
  OPENCV_VERSION: 4.13.0
  # See the ONNX Runtime step in the Go job for why this is 1.21.0 and not the
  # reference's 1.21.1. Kept in step with ports/go/build/Dockerfile's ARG.
  ONNXRUNTIME_VERSION: 1.21.0

jobs:
  # ─── Go ────────────────────────────────────────────────────────────────────
  go:
    name: go — 44/44 stages on 7 cases
    if: ${{ github.event_name == 'schedule' || inputs.port == 'all' || inputs.port == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ports/go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # NO libopencv-dev. It was here, with a comment claiming the apt package was "overridden by the
      # source build in the cache step below" — there was no such step in this job; the sentence was
      # carried over from the Kotlin one. What actually happened on the first real run is worse than
      # a wrong version at conformance time: gocv 0.43.0 does not COMPILE against Ubuntu 24.04's
      # OpenCV 4.6, because its aruco.cpp needs `cv::aruco`, which moved out of contrib into
      # objdetect in 4.7. Fifty lines of "'aruco' in namespace 'cv' does not name a type", naming no
      # version. Go needs the same source build Kotlin does.
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl unzip zlib1g-dev

      # Cached on the version alone: the build depends on nothing else in the repository, and it is
      # a quarter of an hour that must not be paid weekly. Separate from the Kotlin job's cache on
      # purpose — that one is configured with -DBUILD_JAVA=ON and a narrower module list, and one
      # cache serving two different configurations is precisely the divergence the header warns
      # about.
      - name: Cache the OpenCV build
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ~/opencv-go/install
          key: opencv-go-${{ env.OPENCV_VERSION }}-${{ runner.os }}

      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: ports/go/tools/build-opencv.sh ~/opencv-go

      # Separate from the build above because that one is skipped on a cache hit, and both variables
      # are needed either way. Through $GITHUB_ENV rather than a step-level `env:` because Actions
      # does not expand shell variables in `env:` values — see the same note in the Kotlin job.
      # gocv's cgo directives say `pkg-config: opencv4` on Linux, so PKG_CONFIG_PATH is how the
      # compiler finds the headers; LD_LIBRARY_PATH is how the finished binary finds the .so files,
      # which are under $HOME rather than in the loader's default search path.
      #
      # PREPENDED, not assigned. setup-python has already put its own directories in both — and
      # LD_LIBRARY_PATH is where the interpreter finds libpython, so overwriting it would break the
      # conformance step (whose checker is Python) several steps later, in a way that would look
      # like anything but this.
      - name: Locate the OpenCV build
        run: |
          {
            echo "PKG_CONFIG_PATH=$HOME/opencv-go/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=$HOME/opencv-go/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      # 1.21.x is REQUIRED, not preferred: onnxruntime_go v1.19.0 vendors ORT_API_VERSION 21 and a
      # newer runtime rejects the handshake. 1.21.**0** rather than the reference's 1.21.1 because
      # **1.21.1 publishes no CPU tarball** — that release ships only
      # onnxruntime-linux-x64-gpu-1.21.1.tgz, so this step 404'd on its first real run. The same
      # discovery is already recorded in ports/go/build/Dockerfile, which pins 1.21.0 for the same
      # reason; the version now lives in one place at the top of this file so the two cannot drift.
      # The patch difference against the reference is safe on evidence: the spike measured 1.21.1
      # against 1.28.0 on CPU and got bit-identical tensors, so a patch bump inside 1.21 cannot move
      # numbers that two minor versions did not.
      - name: ONNX Runtime
        run: |
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar xzf ort.tgz
          echo "ORT_SO=$PWD/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Install the reference (the checker is Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt

      # The ports read the weights from the same directory the reference does
      # (RDOCS_MODELS_ROOT); since 3.0.2 they are fetched, not checked out.
      - uses: ./.github/actions/fetch-models

      # The port's own script, not a bare `go build ./...`. That was here and would have failed the
      # Conformance step even after compiling cleanly: conformance/ports.json drives
      # ports/go/bin/rdocs-conform, and `go build ./...` writes no binary anywhere. build.sh also
      # asserts the OpenCV version pkg-config reports, which is the check that would have named the
      # real problem on the first run.
      - name: Build
        working-directory: ports/go
        run: ./build.sh

      - name: Unit tests
        working-directory: ports/go
        run: |
          go vet ./...
          go test ./...

      - name: Conformance
        run: python -m conformance.runner run --port go

  # ─── .NET ──────────────────────────────────────────────────────────────────
  dotnet:
    name: dotnet — 44/44 stages on 7 cases
    if: ${{ github.event_name == 'schedule' || inputs.port == 'all' || inputs.port == 'dotnet' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # **OpenCvSharp4.official.runtime.linux-x64 is NOT headless**, which was assumed and is wrong:
      # `ldd` on the shipped native wants GTK 3, Pango, Cairo, ATK, X11 and FreeType. Without them the
      # load fails as "The type initializer for OpenCvSharp.Internal.NativeMethods threw an exception",
      # which names neither OpenCV nor a library. This list is the one the .NET image had to install.
      - name: The native's shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1 libatomic1
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libgdk-pixbuf-2.0-0
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0
          sudo apt-get install -y --no-install-recommends libcairo2 libcairo-gobject2 libatk1.0-0
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libfreetype6 libharfbuzz0b
          sudo apt-get install -y --no-install-recommends libx11-6 libdrm2

      - name: Install the reference (the checker is Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt

      # The ports read the weights from the same directory the reference does
      # (RDOCS_MODELS_ROOT); since 3.0.2 they are fetched, not checked out.
      - uses: ./.github/actions/fetch-models

      - name: Build and test
        working-directory: ports/dotnet
        run: |
          dotnet build RussianDocs.sln -c Release
          dotnet test RussianDocs.sln -c Release --no-build

      - name: Conformance
        run: python -m conformance.runner run --port dotnet

  # ─── Kotlin/JVM ────────────────────────────────────────────────────────────
  #
  # The expensive one: there is no `org.opencv` artefact on Maven Central at all, so OpenCV is built
  # from source with `-DBUILD_JAVA=ON`. The cmake line is kept identical to `tools/build-opencv.sh`
  # and to the Docker stage — two builds that both claim 4.13.0 while differing in configuration is
  # the hardest divergence to find, because every version string agrees.
  java:
    name: java — 44/44 stages on 7 cases
    if: ${{ github.event_name == 'schedule' || inputs.port == 'all' || inputs.port == 'java' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          sudo apt-get install -y --no-install-recommends curl unzip

      # Cached on the version alone: the build depends on nothing else in the repository, and it is
      # twenty minutes that must not be paid weekly.
      - name: Cache the OpenCV build
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ~/opencv-build/build
          key: opencv-java-${{ env.OPENCV_VERSION }}-${{ runner.os }}

      - name: Build OpenCV with the Java bindings
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: ports/java/tools/build-opencv.sh ~/opencv-build

      # Separate from the build above because that one is skipped on a cache hit, and the variable is
      # needed either way. Exported through $GITHUB_ENV rather than a step-level `env:` on purpose:
      # Actions does NOT expand shell variables in `env:` values, so `RDOCS_OPENCV_HOME: $HOME/...`
      # reaches Gradle as the literal seven characters "$HOME/…" and the build fails claiming OpenCV
      # is missing. It was written that way, pointing at ${{ github.workspace }}/../opencv-build —
      # which is /home/runner/work/<repo>/opencv-build, while the script installs into
      # ~/opencv-build. Two separate reasons the same path could never resolve.
      - name: Locate the OpenCV build
        run: echo "RDOCS_OPENCV_HOME=$HOME/opencv-build/build" >> "$GITHUB_ENV"

      - name: Install the reference (the checker is Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt

      # The ports read the weights from the same directory the reference does
      # (RDOCS_MODELS_ROOT); since 3.0.2 they are fetched, not checked out.
      - uses: ./.github/actions/fetch-models

      # RDOCS_TOOLCHAIN_BIN is Windows-only (System32 shadowing a MinGW soname) and deliberately unset
      # here. Neither Windows native-loading trap — J-01 or J-16 — can occur on Linux.
      - name: Build and test
        working-directory: ports/java
        run: ./gradlew --no-daemon build

      - name: Conformance
        run: python -m conformance.runner run --port java
