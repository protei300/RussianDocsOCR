# The checks that must pass on every change.
#
# **Two jobs, and the second one is the point.** A test suite proves the library still does what its
# tests say; the conformance run proves the REFERENCE still reproduces the golden files that three
# other implementations are graded against. Without it in CI the harness is a promise rather than a
# guarantee — a golden can be regenerated by accident and nothing notices until a port "fails".
#
# **The ports are NOT here.** Each needs a native toolchain that takes ten to twenty-five minutes to
# provision — OpenCV 4.13 built from source for Go and Kotlin, plus a GTK stack for .NET — which does
# not belong on the critical path of a pull request. They live in `ports.yml`, on a schedule and on
# demand.
#
# HONEST NOTE ON PROVENANCE: the COMMANDS below are run routinely on a development machine and are
# green there (191 passed / 6 skipped; conformance PASS with zero differences). The WORKFLOW ITSELF has
# never executed — there was no runner available when it was written. Expect the first run to need a
# fix, most likely one of: the apt package list, pip resolution on a clean cache, or
# `RDOCS_MODELS_ROOT` if the checkout layout surprises the loader.
name: CI

on:
  push:
    branches: [main, dev, Service]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref: these jobs are minutes long and nobody
# reads the result of a superseded one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range from the project spec. 3.13 is deliberately absent: numpy 2.2 and
        # onnxruntime 1.21 are pinned, and that pin set is what produced the goldens.
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The project pins opencv-python-headless precisely so no GUI stack is needed; libgl1 and glib
      # are still wanted by transitive imports on a bare runner.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt

      # The weights are not in the repository (since 3.0.2) — see the composite action for how they
      # are fetched and why the cache key is the manifest hash.
      - uses: ./.github/actions/fetch-models

      # Asserted rather than assumed: a checkout that silently lacks them fails later with errors
      # that name no cause. tests/test_models_manifest.py then checks the bytes, not just the count.
      - name: Assert the model artifacts are present
        run: |
          python -c "
          import pathlib, sys
          root = pathlib.Path('document_processing/models')
          onnx = list(root.rglob('*.onnx'))
          cfg = list(root.rglob('model.json'))
          print(f'{len(onnx)} onnx, {len(cfg)} model.json')
          sys.exit('models are missing from the checkout') if len(onnx) < 10 or len(cfg) < 10 else None
          "

      # 75 passed / 6 skipped is the expected shape. The quality regression is opt-in (RUN_QUALITY=1)
      # because it processes every sample and takes minutes.
      #
      # tests/service is kept out twice over, because the two mechanisms fail at different moments.
      # Its conftest drops the directory at COLLECTION when requirements-service.txt is absent — a
      # marker cannot do that, since markers are applied after the module has been imported and the
      # import is what raises ModuleNotFoundError. `-m "not service"` then keeps this job's contents
      # the same on a machine that does have those dependencies installed.
      # (`--ignore=tests/service` is the obvious third option and does nothing: tests/conftest.py
      # chdirs to tests/ during configure, so the relative path matches nothing.)
      - name: Tests
        run: python -m pytest tests/ -m "not service" -q

  # The service suite is separate because its dependencies are: FastAPI, SQLAlchemy and python-jose
  # are not needed to use the library, and installing them in the library matrix would make a job
  # that says "library tests" untrue. No model weights here — these tests use a stand-in for
  # PipelineResults and never construct a Pipeline.
  service:
    name: service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt -r requirements-service.txt

      # 118 passed / 1 skipped is the expected shape; the skip is the --runslow case that would
      # load the real models.
      #
      # Addressed by path, not by marker, on purpose: if the install above half-succeeded, the
      # conftest drops the directory and pytest exits 5 ("no tests ran"), failing this job. With
      # `-m service` it would collect nothing and report success — a job that cannot fail.
      - name: Tests
        run: python -m pytest tests/service -q

  conformance:
    name: conformance — the reference against its own goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements2026.txt

      - uses: ./.github/actions/fetch-models

      # **This is the check that keeps the harness honest.** The reference implementation is run
      # through the same CLI a port uses and compared against the committed goldens: zero differences
      # and zero skips, or the run fails. A regenerated-by-accident golden is caught here and nowhere
      # else.
      - name: The reference reproduces its own goldens
        run: python -m conformance.runner run --port python

      # A stage whose golden is empty compares nothing and passes — the dominant defect class in this
      # project ("a check that could not fail"). Four real instances were found by hand; this makes the
      # fifth loud.
      - name: No golden is empty
        run: |
          python -c "
          import json, pathlib, sys
          empty = []
          for path in pathlib.Path('conformance/cases').rglob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as error:
                  sys.exit(f'{path}: unreadable ({error})')
              if data in (None, {}, []):
                  empty.append(str(path))
          print(f'checked goldens under conformance/cases')
          sys.exit('empty goldens compare nothing:\n  ' + '\n  '.join(empty)) if empty else None
          "

      # The rule with the longest reach: a model, a sample or a built binary under ports/ would put
      # 215 MB per language into git history permanently, and the instinct when a path fails to
      # resolve is to copy the models next to the binary.
      # The Gradle wrapper jar is the one sanctioned exception, and it is not a loophole: it is the
      # 48 KB bootstrap that `./gradlew` needs to exist before it can download anything, every Gradle
      # project in the world commits it, and removing it makes the Kotlin port unbuildable for anyone
      # who does not already have the right Gradle installed. The size guard below is what actually
      # stops a model from arriving disguised as some other extension.
      - name: No binaries under ports/
        run: |
          if git ls-files ports/ \
               | grep -v '^ports/java/gradle/wrapper/gradle-wrapper\.jar$' \
               | grep -Ei '\.(onnx|npz|jpg|jpeg|png|exe|dll|so|dylib|jar)$'; then
            echo "FAIL: ports/ must not carry models, samples or built binaries"
            exit 1
          fi
          # Extension lists only catch what you thought of. A 215 MB weight file under any name is
          # caught here, and the threshold is far above the largest legitimate source file.
          #
          # The `if` is load-bearing under `bash -e`. Written as `[ … ] && echo "$f"`, the test is the
          # loop body's last command, so a final file UNDER the limit made the body, the loop, the
          # pipeline and then the assignment all exit non-zero — and the step died reporting nothing.
          # This check could only ever pass when the last file violated it. It went unnoticed because
          # the job used to fail earlier, on the goldens.
          BIG=$(git ls-files -s ports/ | awk '{print $4}' \
                  | while read -r f; do
                      if [ "$(wc -c <"$f")" -gt 1048576 ]; then echo "$f"; fi
                    done)
          if [ -n "$BIG" ]; then
            echo "FAIL: files over 1 MB under ports/:"
            echo "$BIG"
            exit 1
          fi
          echo "ports/ carries no binaries and nothing over 1 MB"

      # **Nothing internal in a public repository.** Found the hard way: 3.8 MB of `IDScanNet.*` .NET
      # assemblies sat inside `document_processing/` for a long time, imported by nothing, and a design
      # system still carried an internal product name in its header. Neither breaks a build, so only a
      # check finds them. `Melnikov/` and `Valuev/` are excluded — they are personal research
      # workspaces whose fate is a separate decision, not a CI failure.
      - name: No internal names or private binaries
        run: |
          # Two exclusions, both necessary and neither a weakening of the check:
          #   - this very file: a check that searches for a pattern necessarily contains the pattern;
          #   - docs/merge-ports-to-main.md: it names the removed assemblies in the instruction to
          #     strip them from history, and it is branch-local — the merge deletes it (see its header).
          HITS=$(git ls-files -z             | grep -zv -E '^(Melnikov|Valuev)/|^\.github/workflows/ci\.yml$|^docs/merge-ports-to-main\.md$'             | xargs -0 grep -ilE 'idscan|abycus' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: internal names in a public repository:"
            echo "$HITS"
            exit 1
          fi
          echo "no internal names outside the research workspaces"

      # Personal data must never be committed: uploaded documents live in DATA_DIR, outside the tree.
      - name: No data directory was committed
        run: |
          if git ls-files | grep -E '^(service/)?data/'; then
            echo "FAIL: a data directory is tracked — those hold uploaded documents"
            exit 1
          fi
          echo "no data directory is tracked"
